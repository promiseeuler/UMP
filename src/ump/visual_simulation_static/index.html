<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UMP Visual Simulation</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand-block">
      <strong>UMP Visual Simulation</strong>
      <span class="protocol">ump/0.1</span>
    </div>
    <div class="run-status">
      <span id="connection-dot" class="status-dot"></span>
      <span id="connection-label">Loading scenario</span>
      <span class="scope">Semantic twin · no physics</span>
    </div>
  </header>

  <main>
    <section class="simulation-workspace" aria-label="Warehouse simulation">
      <div class="viewport-header">
        <div>
          <span class="eyebrow">Warehouse cell 01</span>
          <h1 id="phase-label">Preparing robots</h1>
        </div>
        <div class="controls" aria-label="Playback controls">
          <button id="reset-button" class="icon-button" type="button" title="Reset simulation" aria-label="Reset simulation">↺</button>
          <button id="play-button" class="play-button" type="button"><span id="play-icon" aria-hidden="true">▶</span><span id="play-label">Run</span></button>
          <label class="speed-control"><span>Speed</span><select id="speed-select"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
        </div>
      </div>
      <div class="canvas-wrap">
        <canvas id="simulation-canvas" aria-label="Animated top-down warehouse showing three robots collaborating"></canvas>
        <div class="canvas-legend" aria-hidden="true">
          <span><i class="legend-swatch route"></i>Approved route</span>
          <span><i class="legend-swatch package"></i>Package</span>
          <span><i class="legend-swatch safety"></i>Safety normal</span>
        </div>
      </div>
      <div class="transport-strip">
        <span>Protocol messages</span>
        <div id="message-pulses" class="message-pulses"></div>
        <strong id="message-count">0</strong>
      </div>
    </section>

    <aside class="telemetry" aria-label="Robot telemetry">
      <div class="telemetry-heading">
        <div><span class="eyebrow">Live participants</span><h2>Robot state</h2></div>
        <span id="robot-count" class="count">0</span>
      </div>
      <div id="robot-list" class="robot-list"></div>
      <section class="goal-section">
        <span class="eyebrow">Shared goal</span>
        <strong id="goal-description">Waiting for scenario</strong>
        <div class="goal-progress"><span id="goal-progress-bar"></span></div>
        <div class="goal-meta"><span id="goal-status">Pending</span><span id="elapsed">00:00</span></div>
      </section>
    </aside>

    <section class="timeline-panel" aria-label="Plan and event timeline">
      <div class="plan-steps" id="plan-steps"></div>
      <div class="event-stream">
        <div class="event-heading"><span class="eyebrow">Event stream</span><strong id="event-summary">No events</strong></div>
        <div id="events" class="events"></div>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
