[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-machine-protocol"
version = "0.1.0"
description = "Manufacturer-neutral shared awareness and collaboration for robots"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "UMP Contributors" }]
dependencies = ["cryptography>=43,<47", "jsonschema>=4.23,<5"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Manufacturing",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
]

[project.urls]
Homepage = "https://github.com/promiseeuler/UMP"
Repository = "https://github.com/promiseeuler/UMP"
Issues = "https://github.com/promiseeuler/UMP/issues"

[project.scripts]
ump-adapter-conformance = "ump.cli:adapter_conformance_main"
ump-demo = "ump.demo:main"
ump-authority = "ump.cli:authority_main"
ump-benchmark = "ump.cli:benchmark_main"
ump-conformance = "ump.cli:conformance_main"
ump-coordinator = "ump.cli:coordinator_main"
ump-credentials = "ump.cli:credentials_main"
ump-deployment = "ump.cli:deployment_main"
ump-goal = "ump.cli:goal_main"
ump-inspector = "ump.cli:inspector_main"
ump-integration = "ump.cli:integration_main"
ump-lan-benchmark = "ump.cli:lan_benchmark_main"
ump-lan-evidence = "ump.cli:lan_evidence_main"
ump-node = "ump.cli:node_main"
ump-network-config = "ump.cli:network_config_main"
ump-network-diagnostics = "ump.cli:network_diagnostics_main"
ump-reconcile = "ump.cli:reconcile_main"
ump-vocabulary = "ump.cli:vocabulary_main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ump = [
  "adapter_evidence_data/**/*.json",
  "deployment_data/**/*.json",
  "inspector_static/*.html",
  "inspector_static/*.css",
  "inspector_static/*.js",
  "integration_data/**/*.json",
  "mapping_data/**/*.json",
  "vocabulary_data/**/*.json",
  "lan_evidence_data/**/*.json",
  "network_config_data/**/*.json",
  "goal_data/**/*.json",
]
