[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-machine-protocol"
version = "0.1.0"
description = "Manufacturer-neutral shared awareness and collaboration for robots"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "UMP Contributors" }]
dependencies = ["cryptography>=43,<47", "jsonschema>=4.23,<5"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Manufacturing",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
]

[project.urls]
Homepage = "https://github.com/promiseeuler/UMP"
Repository = "https://github.com/promiseeuler/UMP"
Issues = "https://github.com/promiseeuler/UMP/issues"

[project.scripts]
ump-demo = "ump.demo:main"
ump-authority = "ump.cli:authority_main"
ump-benchmark = "ump.cli:benchmark_main"
ump-conformance = "ump.cli:conformance_main"
ump-credentials = "ump.cli:credentials_main"
ump-inspector = "ump.cli:inspector_main"
ump-reconcile = "ump.cli:reconcile_main"
ump-readiness = "ump.cli:readiness_main"
ump-vocabulary = "ump.cli:vocabulary_main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ump = [
  "inspector_static/*.html",
  "inspector_static/*.css",
  "inspector_static/*.js",
  "vocabulary_data/**/*.json",
]
