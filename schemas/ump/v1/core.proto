syntax = "proto3";

package ump.v1;

import "ump/v1/machine.proto";
import "ump/v1/task.proto";
import "ump/v1/coordination.proto";

message Envelope {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  string message_id = 3;
  string source_machine_id = 4;
  string source_session_id = 5;
  uint64 sent_at_ms = 6;
  optional uint64 expires_at_ms = 7;
  string correlation_id = 8;
  string causation_id = 9;

  oneof body {
    Hello hello = 10;
    Welcome welcome = 11;
    NegotiationRejected negotiation_rejected = 12;
    Heartbeat heartbeat = 13;
    Advertisement advertisement = 14;
    StateUpdate state_update = 15;
    ErrorReport error_report = 16;
    LeaseGrant lease_grant = 20;
    LeaseRenew lease_renew = 21;
    LeaseRevoke lease_revoke = 22;
    TaskRequest task_request = 23;
    TaskAcknowledgement task_acknowledgement = 24;
    TaskProgress task_progress = 25;
    TaskTerminal task_terminal = 26;
    TaskCancel task_cancel = 27;
    TaskReconcileRequest task_reconcile_request = 28;
    TaskReconcileResponse task_reconcile_response = 29;
    ReservationRequest reservation_request = 30;
    ReservationResponse reservation_response = 31;
    ReservationRelease reservation_release = 32;
    HandoffProposal handoff_proposal = 33;
    HandoffUpdate handoff_update = 34;
    HandoffRecord handoff_record = 35;
    HandoffReconcileRequest handoff_reconcile_request = 36;
    HandoffReconcileResponse handoff_reconcile_response = 37;
  }
}

message Hello {
  repeated uint32 supported_major_versions = 1;
  uint32 minimum_minor_version = 2;
  uint32 maximum_minor_version = 3;
  uint64 presence_ttl_ms = 4;
}

message Welcome {
  uint32 selected_major_version = 1;
  uint32 selected_minor_version = 2;
  uint64 presence_ttl_ms = 3;
}

message NegotiationRejected {
  string code = 1;
  string detail = 2;
}

message Heartbeat {
  uint64 sequence = 1;
  uint64 presence_ttl_ms = 2;
}
