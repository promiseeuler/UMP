[workspace]
members = [
    "crates/ump-protocol",
    "crates/ump-runtime",
    "crates/ump-sim",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ump-protocol/ump"
rust-version = "1.85"

[workspace.dependencies]
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

