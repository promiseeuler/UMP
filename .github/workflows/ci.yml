name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m ump.demo
      - run: ump-conformance conformance/v0.1
      - run: ump-benchmark
      - run: ump-benchmark --profile tls-loopback --samples 100
      - run: ump-readiness --validate-only
      - run: python -m json.tool schemas/ump-v0.schema.json > /dev/null
