name: ROS 2 Jazzy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:noble
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy
      - name: Install Gazebo integration
        run: |
          apt-get update
          apt-get install -y ros-jazzy-ros-gz-sim
      - name: Resolve dependencies
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          rosdep install --from-paths ros2_ws/src --ignore-src -r -y
          python3 -m pip install --break-system-packages .
      - name: Build and test packages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          colcon build --symlink-install --event-handlers console_direct+
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
      - name: Run headless runtime smoke
        shell: bash
        env:
          ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
          ROS_DOMAIN_ID: "73"
          ROS2CLI_NO_DAEMON: "1"
        run: |
          source /opt/ros/jazzy/setup.bash
          source ros2_ws/install/setup.bash
          timeout 180s bash ros2_ws/smoke.sh
          ump-ros2-evidence /tmp/ump-ros2-gazebo-smoke.json \
            --world ros2_ws/src/ump_gazebo_demo/worlds/three_robot_world.sdf \
            --revision "$GITHUB_SHA"
      - name: Retain native smoke evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ros2-gazebo-smoke-${{ github.sha }}
          path: /tmp/ump-ros2-gazebo-smoke.json
          if-no-files-found: error
          retention-days: 30
