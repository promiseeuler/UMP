name: ROS 2 Jazzy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    container:
      image: ubuntu:noble
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy
      - name: Install simulator integrations
        run: |
          apt-get update
          apt-get install -y curl ros-jazzy-ros-gz-sim ros-jazzy-webots-ros2-driver xauth xvfb
          curl -fL -o /tmp/webots.deb \
            https://github.com/cyberbotics/webots/releases/download/R2025a/webots_2025a_amd64.deb
          apt-get install -y /tmp/webots.deb
      - name: Resolve dependencies
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          rosdep install --from-paths ros2_ws/src --ignore-src -r -y
          python3 -m pip install --break-system-packages --ignore-installed .
      - name: Build and test packages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          colcon build --symlink-install --event-handlers console_direct+
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
      - name: Run headless runtime smoke
        shell: bash
        env:
          ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
          ROS_DOMAIN_ID: "73"
          ROS2CLI_NO_DAEMON: "1"
        run: |
          source /opt/ros/jazzy/setup.bash
          source ros2_ws/install/setup.bash
          timeout 180s bash ros2_ws/smoke.sh
          ump-ros2-evidence /tmp/ump-ros2-gazebo-smoke.json \
            --world ros2_ws/src/ump_gazebo_demo/worlds/three_robot_world.sdf \
            --revision "$GITHUB_SHA"
      - name: Run Webots visual-profile smoke
        shell: bash
        env:
          ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
          ROS_DOMAIN_ID: "74"
          ROS2CLI_NO_DAEMON: "1"
        run: |
          source /opt/ros/jazzy/setup.bash
          source ros2_ws/install/setup.bash
          xvfb-run -a timeout 240s bash ros2_ws/webots_smoke.sh
          ump-ros2-evidence /tmp/ump-ros2-webots-smoke.json \
            --world ros2_ws/src/ump_webots_demo/worlds/ump_warehouse.wbt \
            --revision "$GITHUB_SHA"
      - name: Attest native smoke evidence
        if: success() && github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: /tmp/ump-ros2-*-smoke.json
      - name: Retain native smoke evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ros2-simulator-smoke-${{ github.sha }}
          path: /tmp/ump-ros2-*-smoke.json
          if-no-files-found: error
          retention-days: 90
