name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  native:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Validate release version
        run: |
          version=${GITHUB_REF_NAME#v}
          workspace_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$version" = "$workspace_version"
      - run: cargo test --workspace
      - name: Build release artifacts
        run: |
          version=${GITHUB_REF_NAME#v}
          UMP_PACKAGE_VERSION="$version" UMP_PACKAGE_ARCH=${{ matrix.architecture }} make native-package-test
          UMP_PACKAGE_VERSION="$version" UMP_PACKAGE_ARCH=${{ matrix.architecture }} packaging/native/build-bundle.sh
          packaging/native/test-bundle.sh "dist/ump_${version}_linux_${{ matrix.architecture }}.tar.gz"
      - uses: sigstore/cosign-installer@v3
      - name: Sign native artifacts with GitHub OIDC
        run: |
          for artifact in dist/*.deb dist/*.tar.gz; do
            cosign sign-blob --yes --bundle "$artifact.sigstore.json" "$artifact"
          done
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/**
      - uses: actions/upload-artifact@v4
        with:
          name: ump-native-${{ matrix.architecture }}
          path: dist/*
          if-no-files-found: error

  container:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.names.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        name: Resolve image names
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version=${GITHUB_REF_NAME#v}
          echo "image=$image" >>"$GITHUB_OUTPUT"
          echo "tags=$image:$version,$image:latest" >>"$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/container/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.tags }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign container manifest
        run: cosign sign --yes "${{ steps.names.outputs.image }}@${{ steps.build.outputs.digest }}"

  ros2:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and install-test ROS 2 Jazzy package
        run: |
          version=${GITHUB_REF_NAME#v}
          PACKAGE_VERSION="$version" ROS_ARCH=${{ matrix.architecture }} \
            ROS_PLATFORM=${{ matrix.platform }} make ros2-package-test
      - uses: sigstore/cosign-installer@v3
      - name: Sign ROS 2 package with GitHub OIDC
        run: |
          artifact="dist/ump-ros2-jazzy_${GITHUB_REF_NAME#v}_${{ matrix.architecture }}.deb"
          cosign sign-blob --yes --bundle "$artifact.sigstore.json" "$artifact"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/ump-ros2-jazzy_*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: ump-ros2-jazzy-${{ matrix.architecture }}
          path: dist/ump-ros2-jazzy_*
          if-no-files-found: error

  publish:
    needs: [native, container, ros2]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ump-*
          path: dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@v3
      - name: Create and sign aggregate checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name '*.sigstore.json' -printf '%f\0' \
            | sort -z | xargs -0 sha256sum >SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            dist/* \
            --title "UMP ${GITHUB_REF_NAME#v}"
