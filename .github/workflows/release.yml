name: Release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Test
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m unittest discover -s tests -v
      - name: Build distributions
        run: |
          python -m pip install build twine cyclonedx-bom==7.3.1
          python -m build
          python -m twine check dist/*
          tar -tzf dist/*.tar.gz | grep '/schemas/ump-v0.schema.json$'
          tar -tzf dist/*.tar.gz | grep '/schemas/ump-integration-config-v1.schema.json$'
          tar -tzf dist/*.tar.gz | grep '/schemas/ump-mapping-report-v1.schema.json$'
          tar -tzf dist/*.tar.gz | grep '/schemas/ump-hardware-readiness-report-v1.schema.json$'
          tar -tzf dist/*.tar.gz | grep '/conformance/v0.1/manifest.json$'
          tar -tzf dist/*.tar.gz | grep '/REFERENCE.md$'
          cyclonedx-py environment --output-format JSON --output-file dist/sbom.cdx.json
      - name: Test installed wheel
        run: |
          python -m venv /tmp/ump-release
          /tmp/ump-release/bin/python -m pip install dist/*.whl
          (cd /tmp && /tmp/ump-release/bin/ump-demo)
          (cd /tmp && /tmp/ump-release/bin/ump-conformance --help)
          (cd /tmp && /tmp/ump-release/bin/ump-adapter-conformance --help)
          (cd /tmp && /tmp/ump-release/bin/ump-node --help)
          (cd /tmp && /tmp/ump-release/bin/ump-inspector --help)
          (cd /tmp && /tmp/ump-release/bin/ump-ops --help)
          (cd /tmp && /tmp/ump-release/bin/ump-integration schema)
          (cd /tmp && /tmp/ump-release/bin/ump-lab schema readiness)
          (cd /tmp && /tmp/ump-release/bin/ump-readiness --validate-only)
      - name: Generate checksums
        run: sha256sum dist/*.whl dist/*.tar.gz dist/sbom.cdx.json > dist/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: ump-${{ github.ref_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.cdx.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
