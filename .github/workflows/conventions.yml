name: Repository conventions

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conventions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate filenames
        run: python scripts/check_repo_conventions.py
      - name: Validate commit subjects
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          if [[ "$range" == 0000000000000000000000000000000000000000..* ]]; then
            range="${{ github.sha }}^..${{ github.sha }}"
          fi
          git log --format=%s "$range" | while IFS= read -r subject; do
            python scripts/check_repo_conventions.py "$subject"
          done
